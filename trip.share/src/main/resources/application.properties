spring.application.name=trip.share
app.firebase.key-path=${FIREBASE_KEY_PATH:file:../.secrets/firebase.json}
app.auth.bearer-fallback-enabled=${APP_AUTH_BEARER_FALLBACK_ENABLED:true}
app.auth.cookie.name=${APP_AUTH_COOKIE_NAME:tripshare_session}
app.auth.cookie.max-age=${APP_AUTH_COOKIE_MAX_AGE:5d}
app.auth.cookie.secure=${APP_AUTH_COOKIE_SECURE:false}
app.auth.cookie.same-site=${APP_AUTH_COOKIE_SAME_SITE:Lax}
app.auth.cookie.domain=${APP_AUTH_COOKIE_DOMAIN:}
app.auth.cookie.check-revoked=${APP_AUTH_COOKIE_CHECK_REVOKED:true}
app.foursquare.key-path=${FOURSQUARE_KEY_PATH:file:../.secrets/foursquare.txt}
app.foursquare.timeout-seconds=${FOURSQUARE_TIMEOUT_SECONDS:5}
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.ignore-migration-patterns=
