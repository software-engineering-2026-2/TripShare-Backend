openapi: 3.0.3
info:
  title: TripShare — Gerenciamento de viagens
  version: '1.0'
  description: |
    Gerenciamento de viagens. As rotas protegidas usam Firebase Session Cookie HttpOnly.
    Login e cadastro recebem Bearer ID token para criar a sessão. O cookie padrão é
    tripshare_session; durante a migração, o servidor também pode aceitar Bearer por configuração.
security:
  - firebaseSessionCookie: []
paths:
  /auth/login:
    post:
      operationId: login
      summary: Autentica o perfil Firebase e cria a sessão HttpOnly.
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uuid]
              properties:
                uuid: {type: string, maxLength: 128}
      responses:
        '200':
          description: Perfil existente; corpo de usuário preservado.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/sessionCookie'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /auth/register:
    post:
      operationId: register
      summary: Cria perfil local e cria a sessão HttpOnly.
      security:
        - firebaseBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [uuid, username, name]
              properties:
                uuid: {type: string, maxLength: 128}
                username: {type: string, maxLength: 50}
                name: {type: string, maxLength: 120}
                phone: {type: string, nullable: true, maxLength: 32}
                bio: {type: string, nullable: true}
                hometown: {type: string, nullable: true}
      responses:
        '201':
          description: Perfil criado; corpo de usuário preservado.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/sessionCookie'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409':
          description: UID, e-mail ou username já cadastrado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
        '503': {$ref: '#/components/responses/Unavailable'}
  /auth/logout:
    post:
      operationId: logout
      summary: Encerra a sessão e expira o cookie.
      description: |
        O cookie é opcional. A sessão válida tem seus refresh tokens revogados no Firebase.
        Sem cookie ou com cookie inválido, a operação continua idempotente e retorna 204.
      security: []
      parameters:
        - name: tripshare_session
          in: cookie
          required: false
          schema: {type: string}
          description: Nome padrão; configurável por APP_AUTH_COOKIE_NAME.
      responses:
        '204':
          description: Cookie expirado; nenhum corpo.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/expiredSessionCookie'
        '403': {$ref: '#/components/responses/Forbidden'}
  /users/{id}:
    get:
      operationId: getPublicUserProfile
      summary: Consulta as informações públicas de um perfil.
      description: O identificador é o UUID interno do usuário. A rota exige autenticação.
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Perfil público encontrado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserPublic'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /users/me:
    patch:
      operationId: updateCurrentUserProfile
      summary: Atualiza os campos informados do perfil autenticado.
      description: Campos omitidos ou nulos não são alterados.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/User'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /trips/{id}:
    parameters:
      - $ref: '#/components/parameters/tripId'
    patch:
      operationId: updateTrip
      summary: Atualiza os campos informados da viagem.
      description: |
        Os dias são numerados a partir de 1. Em viagens com datas fixas, alterar apenas a duração
        ajusta a data final. Em viagens sem datas, informe ambas para definir o período.
        A duração informada junto com datas deve corresponder ao intervalo inclusivo.
        Ao encurtar a viagem, envie uma resolução por dia conflitante após receber 409.
        A alteração do período e as resoluções são gravadas em uma única transação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: {type: string, maxLength: 120, pattern: '.*\S.*'}
                destinationId: {type: string, format: uuid}
                startsOn: {type: string, format: date}
                endsOn: {type: string, format: date}
                durationDays: {type: integer, minimum: 1}
                resolutions:
                  type: array
                  items:
                    oneOf:
                      - type: object
                        required: [dayNumber, action, targetDay]
                        properties:
                          dayNumber: {type: integer, minimum: 1}
                          action: {type: string, enum: [MOVE]}
                          targetDay: {type: integer, minimum: 1, description: Dia mantido no novo período.}
                      - type: object
                        additionalProperties: false
                        required: [dayNumber, action]
                        properties:
                          dayNumber: {type: integer, minimum: 1}
                          action: {type: string, enum: [REMOVE]}
            examples:
              reduzir:
                value: {durationDays: 3}
              resolver:
                value:
                  durationDays: 3
                  resolutions:
                    - {dayNumber: 4, action: MOVE, targetDay: 2}
                    - {dayNumber: 5, action: REMOVE}
      responses:
        '200':
          description: Viagem atualizada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Trip'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409':
          description: O novo período exige resolver atividades ou a remoção inviabilizaria uma publicação.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Error'
                  - type: object
                    properties:
                      conflicts:
                        type: array
                        items:
                          type: object
                          required: [dayNumber, activityCount]
                          properties:
                            dayNumber: {type: integer}
                            activityCount: {type: integer, format: int64}
              examples:
                diasExcedentes:
                  value:
                    status: 409
                    message: 'Cannot shorten trip: activities exist on days outside the new period'
                    conflicts:
                      - {dayNumber: 4, activityCount: 2}
                      - {dayNumber: 5, activityCount: 1}
                publicacao:
                  value: {status: 409, message: A public itinerary needs an activity with an identified location}
    delete:
      operationId: deleteTrip
      summary: Exclui a viagem inteira e seus dependentes após confirmação.
      description: |
        Envie DELETE /trips/{id}?confirm=true para confirmar. A exclusão abrange todos os roteiros,
        inclusive os de outras páginas da prévia. Para cancelar, encerre a consulta à prévia.
      parameters:
        - name: confirm
          in: query
          required: true
          description: A confirmação exige o valor literal true.
          schema: {type: string, enum: ['true']}
          example: 'true'
      responses:
        '204': {description: Viagem e vínculos excluídos na mesma transação.}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /trips/{id}/delete-preview:
    parameters:
      - $ref: '#/components/parameters/tripId'
    get:
      operationId: previewTripDeletion
      summary: Lista os roteiros e vínculos afetados pela exclusão.
      description: Ordenação crescente por título e UUID. A consulta inclui os roteiros privados da viagem.
      parameters:
        - name: page
          in: query
          schema: {type: integer, format: int32, minimum: 0, default: 0}
        - name: size
          in: query
          description: Valores maiores que 100 são aceitos e ajustados para 100.
          schema: {type: integer, format: int32, minimum: 1, default: 20}
      responses:
        '200':
          description: A página solicitada e os totais da viagem. Páginas sem resultados têm conteúdo vazio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeletePreview'
              example:
                content:
                  - id: 60000000-0000-0000-0000-000000000001
                    title: Roteiro de museus
                    published: true
                    favoriteCount: 2
                    inRanking: true
                page: 0
                size: 20
                totalElements: 1
                totalPages: 1
                last: true
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  securitySchemes:
    firebaseBearer: {type: http, scheme: bearer, bearerFormat: Firebase ID token}
    firebaseSessionCookie:
      type: apiKey
      in: cookie
      name: tripshare_session
      description: Cookie padrão; nome e atributos são configuráveis no backend.
  headers:
    sessionCookie:
      description: Firebase Session Cookie HttpOnly; o browser deve armazená-lo automaticamente.
      schema: {type: string}
    expiredSessionCookie:
      description: Mesmo cookie com Path e atributos originais e Max-Age=0.
      schema: {type: string}
  parameters:
    tripId:
      name: id
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    BadRequest:
      description: Parâmetros, período, resoluções ou confirmação inválidos.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthorized:
      description: Cookie de sessão ausente/inválido ou token Firebase inválido.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: Perfil suspenso ou viagem de outro proprietário.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: Viagem, perfil ou destino informado na edição inexistente.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unavailable:
      description: Firebase ou banco de dados indisponível.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [status, message]
      properties:
        status: {type: integer}
        message: {type: string}
    DeletePreview:
      type: object
      required: [content, page, size, totalElements, totalPages, last]
      properties:
        content:
          type: array
          items:
            type: object
            required: [id, title, published, favoriteCount, inRanking]
            properties:
              id: {type: string, format: uuid}
              title: {type: string}
              published: {type: boolean, description: Indica que a visibilidade do roteiro é pública.}
              favoriteCount: {type: integer, format: int64, minimum: 0}
              inRanking: {type: boolean, description: Indica presença no ranking público atual.}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1, maximum: 100}
        totalElements: {type: integer, format: int64, minimum: 0}
        totalPages: {type: integer, format: int64, minimum: 0}
        last: {type: boolean}
    Trip:
      type: object
      required: [id, userId, destinationId, destinationName, destinationRegion, destinationCountryCode, title, startsOn, endsOn, durationDays, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        destinationId: {type: string, format: uuid}
        destinationName: {type: string}
        destinationRegion: {type: string, nullable: true}
        destinationCountryCode: {type: string}
        title: {type: string}
        startsOn: {type: string, format: date, nullable: true}
        endsOn: {type: string, format: date, nullable: true}
        durationDays: {type: integer}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    User:
      type: object
      description: Resposta atual de perfil; o Session Cookie é entregue somente por Set-Cookie.
      properties:
        id: {type: string, format: uuid}
        authId: {type: string, format: uuid}
        uuid: {type: string}
        username: {type: string}
        name: {type: string}
        email: {type: string, format: email}
        phone: {type: string, nullable: true}
        bio: {type: string, nullable: true}
        hometown: {type: string, nullable: true}
        role: {type: string}
        status: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    UserPublic:
      type: object
      required: [username, name]
      properties:
        username: {type: string}
        name: {type: string}
        bio: {type: string, nullable: true}
        hometown: {type: string, nullable: true}
    UpdateUserRequest:
      type: object
      properties:
        name: {type: string, maxLength: 120, pattern: '.*\S.*'}
        phone: {type: string, maxLength: 32, pattern: '^\+[1-9]\d{1,14}$'}
        bio: {type: string, maxLength: 500}
        hometown: {type: string, maxLength: 120}
