services:

  spring:
    profiles: ["app"]
    build:
      context: .
      target: runtime
    container_name: ${SPRING_CONTAINER_NAME:-spring-app}
    ports:
      - "${SPRING_PORT:-8080}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mydatabase}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      FIREBASE_KEY_PATH: ${FIREBASE_KEY_PATH:-file:/run/secrets/firebase.json}
      APP_AUTH_BEARER_FALLBACK_ENABLED: ${APP_AUTH_BEARER_FALLBACK_ENABLED:-true}
      APP_AUTH_COOKIE_NAME: ${APP_AUTH_COOKIE_NAME:-tripshare_session}
      APP_AUTH_COOKIE_MAX_AGE: ${APP_AUTH_COOKIE_MAX_AGE:-5d}
      APP_AUTH_COOKIE_SECURE: ${APP_AUTH_COOKIE_SECURE:-false}
      APP_AUTH_COOKIE_SAME_SITE: ${APP_AUTH_COOKIE_SAME_SITE:-Lax}
      APP_AUTH_COOKIE_DOMAIN: ${APP_AUTH_COOKIE_DOMAIN:-}
      APP_AUTH_COOKIE_CHECK_REVOKED: ${APP_AUTH_COOKIE_CHECK_REVOKED:-true}
    volumes:
      - type: bind
        source: ${FIREBASE_CREDENTIALS_FILE:-./.secrets/firebase.json}
        target: /run/secrets/firebase.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    profiles: ["tools", "app"]
    build:
      context: .
      target: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mydatabase}
      FLYWAY_USER: ${POSTGRES_USER:-postgres}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      FLYWAY_IGNORE_MIGRATION_PATTERNS: ""
    volumes:
      - ./trip.share/src/main/resources/db/migration:/app/src/main/resources/db/migration:ro
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      org.springframework.boot.ignore: "true"

  postgres:
  
    image: postgres:16
    container_name: ${POSTGRES_CONTAINER_NAME:-spring-db}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mydatabase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
